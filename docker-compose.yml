# =============================================================================
# Legalite AI - Local development stack
# Brings up: FastAPI app, PostgreSQL, self-hosted Qdrant, Redis, Arq worker
#
# Qdrant runs entirely inside this compose network with API-key auth and a
# persistent volume — no Qdrant Cloud dependency. See docs/QDRANT_SELF_HOSTED.md
# for production deployment notes and the Cloud -> self-hosted data migration.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalite-app
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Hot-reload source in dev. Remove for production-like runs.
      - ./app:/app/app
      - ./alembic.ini:/app/alembic.ini
      - upload_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  worker:
    # Phase 5 M4 — Arq worker for background PDF ingestion. Shares the same
    # image as the app so library versions can't drift between the two.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalite-worker
    env_file: .env
    volumes:
      - ./app:/app/app
      - upload_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: legalite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legalite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-legalite}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalite} -d ${POSTGRES_DB:-legalite}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    # Self-hosted Qdrant, replacing Qdrant Cloud. API-key auth is enabled via
    # QDRANT__SERVICE__API_KEY so the app + worker must authenticate exactly
    # as they did against the Cloud cluster (QdrantClient(api_key=...) is
    # unchanged in app/vector_store/qdrant_client.py).
    image: qdrant/qdrant:v1.12.4
    container_name: legalite-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set — generate one with `openssl rand -hex 32`}
    ports:
      # Bound to localhost only — the app/worker reach Qdrant over the
      # internal compose network (qdrant:6333); these host bindings are for
      # local debugging (curl, dashboard) and are not reachable externally.
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The official image ships no curl/wget, only bash — probe the REST
      # port with a raw TCP connect via bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    # Phase 5 M4 — broker for the Arq ingestion worker.
    # Local Redis runs INSIDE the compose network only; the host port
    # is intentionally not published. The app + worker connect via the
    # ``REDIS_URL`` env var which today points at Railway's managed
    # Redis. The container is kept around so the depends_on graph
    # still resolves cleanly — removing it would mean editing app +
    # worker service defs to drop the dependency.
    image: redis:7-alpine
    container_name: legalite-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  upload_data:
  redis_data:
