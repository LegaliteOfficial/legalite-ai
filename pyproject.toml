[project]
name = "legalite-ai"
version = "0.1.0"
description = "AI-powered Ghana Legal Assistant - RAG over Ghana legal documents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Legalite AI" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "black>=24.10.0",
    "mypy>=1.14.1",
    "pre-commit>=4.0.1",
    "types-requests",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The repo root holds several top-level directories (app, evaluation,
# tests, alembic); only app is the installable package. Without this,
# setuptools' automatic discovery refuses the flat layout and
# `pip install -e .` fails.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit (security)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "S101", # allow assert in tests
    "B008", # FastAPI uses function calls in defaults (Depends, etc.)
    "E501", # line length is enforced by `ruff format`; long strings/comments are left as written
    # FastAPI and Pydantic resolve annotations at runtime, so moving imports
    # into `if TYPE_CHECKING:` blocks breaks request parsing and models.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "app/db/migrations/versions"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["app/db/migrations/versions"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that hit real services",
]
