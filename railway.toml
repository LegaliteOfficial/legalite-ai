# Railway service config for the legalite-ai web tier.
#
# This forces Railway to use the project's hand-written Dockerfile instead
# of Railpack's auto-builder. Railpack would otherwise miss the OS-level
# dependencies we need (tesseract-ocr for OCR fallback, libpq5 for psycopg)
# AND fail to locate the entry point because app/main.py is inside a
# package, not at the repo root.
#
# For the Arq worker, create a SECOND Railway service from the same repo
# and override its start command — see "Worker service" in BACKUP.md /
# the deployment notes.

[build]
builder      = "DOCKERFILE"
# Path is relative to the repo root. With Dockerfile at the root,
# Railway's auto-detection also picks it up — the explicit path here is
# belt-and-braces in case auto-detection ever regresses.
dockerfilePath = "Dockerfile"

[deploy]
# Boot uvicorn directly — do NOT chain ``alembic upgrade head`` here.
# Neon's pooler + Railway's cold-start window means alembic frequently
# takes 30-60s to acquire a connection and finish, which blows past the
# healthcheck budget and Railway kills the replica before it ever binds
# to $PORT. Run migrations as a one-off instead:
#
#     railway run alembic upgrade head     # from your laptop, against prod
#
# or via a separate one-shot service whose start command IS
# ``alembic upgrade head`` and which has no healthcheck.
# ``$PORT`` must be shell-expanded, so we explicitly wrap in ``sh -c``.
# Without the shell, Railway/Docker would invoke uvicorn directly and the
# literal string ``$PORT`` would be passed as the port argument.
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath           = "/health"
# 300s is overkill for a healthy replica, but it absorbs OpenAI client
# warmup + Qdrant index creation on a cold container.
healthcheckTimeout        = 300
restartPolicyType         = "ON_FAILURE"
restartPolicyMaxRetries   = 3
# Railway injects $PORT at runtime; uvicorn must bind to it, NOT to a fixed
# port. The 8000 in docker-compose.yml is for local dev only.
